[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "datacleaner"
version = "0.1.0"
description = "LLM-assisted, validated, deterministic data cleaning CLI"
requires-python = ">=3.11"
dependencies = [
    "jsonschema>=4.20",
    "google-re2>=1.1",
    "pandas>=2.2",
    "datacompy>=0.13",
    "openpyxl>=3.1",
    "google-genai>=1.0",
    "python-dotenv>=1.0",
]

[project.scripts]
datacleaner = "datacleaner.cli:run"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
datacleaner = ["plan.schema.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
